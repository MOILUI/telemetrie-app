# Stack production hardenée : Caddy + Backend + Uptime Kuma
# Lancer : docker compose -f docker-compose.prod.yml up -d
#
# Prérequis : .env rempli (cf .env.example), Docker installé, ports 80/443/1883 ouverts

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - tlmnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  telemetry:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:3000:3000"   # uniquement localhost — exposition via Caddy
      - "1883:1883"              # MQTT TCP (à passer en 8883 + TLS dans une v2)
    volumes:
      - telemetry_data:/app/backend/data
    networks:
      - tlmnet
    security_opt:
      - no-new-privileges:true
    read_only: false              # SQLite a besoin d'écrire
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  uptime:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_data:/app/data
    networks:
      - tlmnet

  # Backup automatique chaque nuit à 3h
  backup:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - telemetry_data:/data:ro
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite gnupg rclone bash && crond -f -l 8"]
    environment:
      - BACKUP_GPG_RECIPIENT=${BACKUP_GPG_RECIPIENT:-}
      - BACKBLAZE_BUCKET=${BACKBLAZE_BUCKET:-}
    networks:
      - tlmnet

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  telemetry_data:
  uptime_data:

networks:
  tlmnet:
    driver: bridge

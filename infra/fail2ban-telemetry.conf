# fail2ban — protection brute force login + API
# Copier dans /etc/fail2ban/jail.d/telemetry.conf et redémarrer fail2ban
#
# Crée un filtre /etc/fail2ban/filter.d/telemetry-auth.conf avec :
#   [Definition]
#   failregex = ^.*"POST /api/login.*" 401 .*$
#               ^.*Auth refus[ée] .*$
#   ignoreregex =

[telemetry-auth]
enabled  = true
port     = http,https
filter   = telemetry-auth
logpath  = /var/log/caddy/access.log
maxretry = 5
findtime = 600
bantime  = 3600
banaction = ufw

[sshd]
enabled = true
maxretry = 3
findtime = 600
bantime = 86400

[recidive]
enabled = true
filter = recidive
logpath = /var/log/fail2ban.log
action = ufw
bantime = 604800   # 1 semaine
findtime = 86400
maxretry = 5

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un compte — Télémétrie</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<header class="bg-white border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <span class="text-2xl">📡</span>
      <span class="font-bold">Télémétrie</span>
    </a>
    <a href="/app/" class="text-sm text-slate-600 hover:text-slate-900">Déjà un compte ? Se connecter</a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="text-3xl">🚀</div>
      <h1 class="text-2xl font-bold mt-2">Démarre ton essai gratuit</h1>
      <p class="text-sm text-slate-600 mt-1">14 jours, jusqu'à 3 machines. Sans CB.</p>
    </div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email professionnel</label>
        <input id="email" type="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="toi@entreprise.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nom de l'entreprise (optionnel)</label>
        <input id="company" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ma société" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
        <input id="password" type="password" required minlength="8" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="8 caractères minimum" />
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg shadow-lg shadow-blue-500/30 transition">
        Créer mon compte
      </button>
      <div id="signupError" class="hidden text-sm text-red-600 text-center"></div>
    </form>

    <p class="text-xs text-slate-500 text-center mt-6">
      En créant un compte, tu acceptes nos conditions d'utilisation et notre politique de confidentialité.
    </p>
  </div>
</main>

<script>
const params = new URLSearchParams(location.search);
const requestedPlan = params.get('plan'); // si on vient des pricing cards

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signupError');
  errEl.classList.add('hidden');
  try {
    const r = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:    document.getElementById('email').value,
        company:  document.getElementById('company').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await r.json();
    if (!r.ok || !data.token) throw new Error(data.error || 'Erreur création compte');
    localStorage.setItem('tlm_token', data.token);

    // Si l'utilisateur vient d'un plan payant → lance Checkout directement
    if (requestedPlan && requestedPlan !== 'trial') {
      const c = await fetch('/api/stripe/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + data.token },
        body: JSON.stringify({ plan: requestedPlan }),
      }).then(r => r.json());
      if (c.url) { window.location.href = c.url; return; }
    }
    window.location.href = '/app/';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
});
</script>
</body>
</html>

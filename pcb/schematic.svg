<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .bg { fill: #f8fafc; }
    .block { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .esp { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; }
    .power { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .input { fill: #d1fae5; stroke: #047857; stroke-width: 1.5; }
    .output { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .comms { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; }
    .label { font-size: 13px; fill: #0f172a; }
    .small { font-size: 11px; fill: #475569; }
    .title { font-size: 16px; font-weight: bold; fill: #0f172a; }
    .h1 { font-size: 22px; font-weight: bold; fill: #0f172a; }
    .pin { font-size: 10px; fill: #64748b; font-family: monospace; }
    .wire { stroke: #1e293b; stroke-width: 1.2; fill: none; }
    .wire-power { stroke: #b91c1c; stroke-width: 2; fill: none; }
    .wire-gnd { stroke: #334155; stroke-width: 2; fill: none; }
    .header-bar { fill: #1e293b; }
    .header-txt { fill: white; font-weight: bold; font-size: 12px; }
  </style>

  <rect class="bg" width="1400" height="900" />

  <!-- TITLE -->
  <text x="700" y="35" class="h1" text-anchor="middle">PCB Télémétrie — Schéma fonctionnel (v1.0)</text>
  <text x="700" y="55" class="small" text-anchor="middle">Shield ESP32 pour supervision multi-machines · 100×80mm · 2 couches</text>

  <!-- ===================== POWER SECTION ===================== -->
  <rect class="header-bar" x="30" y="80" width="280" height="22" rx="3" />
  <text x="170" y="96" text-anchor="middle" class="header-txt">⚡ ALIMENTATION (9-30V DC)</text>

  <g transform="translate(30,110)">
    <rect class="power" width="280" height="200" rx="6" />
    <!-- Connecteur entrée -->
    <rect class="block" x="15" y="20" width="50" height="35" />
    <text x="40" y="42" class="label" text-anchor="middle">J1</text>
    <text x="40" y="68" class="small" text-anchor="middle">Bornier 2-pôles</text>
    <text x="40" y="80" class="small" text-anchor="middle">9-30V DC</text>

    <!-- Polyfuse -->
    <rect class="block" x="80" y="25" width="40" height="25" />
    <text x="100" y="42" class="label" text-anchor="middle">F1</text>
    <text x="100" y="60" class="small" text-anchor="middle">1A reset</text>

    <!-- TVS -->
    <rect class="block" x="135" y="25" width="40" height="25" />
    <text x="155" y="42" class="label" text-anchor="middle">D3</text>
    <text x="155" y="60" class="small" text-anchor="middle">TVS 24V</text>

    <!-- Varistance -->
    <rect class="block" x="190" y="25" width="40" height="25" />
    <text x="210" y="42" class="label" text-anchor="middle">VR1</text>
    <text x="210" y="60" class="small" text-anchor="middle">Varist.30V</text>

    <!-- LM2596 -->
    <rect class="block" x="80" y="100" width="120" height="50" />
    <text x="140" y="125" class="label" text-anchor="middle">U2 — LM2596</text>
    <text x="140" y="142" class="small" text-anchor="middle">Step-down → 5V / 2A</text>

    <!-- Caps -->
    <rect class="block" x="210" y="105" width="55" height="40" />
    <text x="237" y="125" class="small" text-anchor="middle">C1, C2</text>
    <text x="237" y="138" class="small" text-anchor="middle">470µF +</text>
    <text x="237" y="150" class="small" text-anchor="middle">100nF</text>

    <!-- Sortie 5V -->
    <text x="140" y="178" class="label" text-anchor="middle" fill="#b91c1c">→ 5V / 2A vers ESP32</text>
  </g>

  <!-- ===================== ESP32 CENTRAL ===================== -->
  <rect class="header-bar" x="540" y="80" width="320" height="22" rx="3" />
  <text x="700" y="96" text-anchor="middle" class="header-txt">📡 ESP32 + MODEM 4G (LilyGO T-SIM7600E)</text>

  <g transform="translate(540,110)">
    <rect class="esp" width="320" height="320" rx="6" />
    <text x="160" y="30" class="title" text-anchor="middle">LilyGO T-SIM7600E</text>
    <text x="160" y="48" class="small" text-anchor="middle">ESP32-WROVER + Modem 4G LTE Cat-1</text>

    <!-- Headers GPIO -->
    <line x1="20" y1="70" x2="20" y2="290" class="wire" />
    <line x1="300" y1="70" x2="300" y2="290" class="wire" />

    <!-- Pins gauche -->
    <text x="15" y="85" class="pin" text-anchor="end">GND</text>
    <text x="15" y="100" class="pin" text-anchor="end">5V</text>
    <text x="15" y="115" class="pin" text-anchor="end">3.3V</text>
    <text x="15" y="130" class="pin" text-anchor="end">GPIO 34</text>
    <text x="15" y="145" class="pin" text-anchor="end">GPIO 35</text>
    <text x="15" y="160" class="pin" text-anchor="end">GPIO 36</text>
    <text x="15" y="175" class="pin" text-anchor="end">GPIO 39</text>
    <text x="15" y="190" class="pin" text-anchor="end">GPIO 15</text>
    <text x="15" y="205" class="pin" text-anchor="end">GPIO 14</text>
    <text x="15" y="220" class="pin" text-anchor="end">GPIO 32</text>
    <text x="15" y="235" class="pin" text-anchor="end">GPIO 33</text>
    <text x="15" y="250" class="pin" text-anchor="end">GPIO 25</text>
    <text x="15" y="265" class="pin" text-anchor="end">GPIO 21 (SDA)</text>
    <text x="15" y="280" class="pin" text-anchor="end">GPIO 22 (SCL)</text>

    <!-- Pins droite -->
    <text x="305" y="85" class="pin">GPIO 13</text>
    <text x="305" y="100" class="pin">GPIO 12</text>
    <text x="305" y="115" class="pin">GPIO 17 (TX2)</text>
    <text x="305" y="130" class="pin">GPIO 16 (RX2)</text>
    <text x="305" y="145" class="pin">GPIO 4</text>
    <text x="305" y="160" class="pin">GPIO 2</text>
    <text x="305" y="175" class="pin">GPIO 0</text>

    <!-- Antenne -->
    <line x1="160" y1="290" x2="160" y2="310" class="wire" />
    <circle cx="160" cy="310" r="3" fill="#1e293b" />
    <text x="160" y="305" class="small" text-anchor="middle" dy="-5">📶 SMA</text>
  </g>

  <!-- ===================== INPUTS BLOCK ===================== -->
  <rect class="header-bar" x="30" y="340" width="490" height="22" rx="3" />
  <text x="275" y="356" text-anchor="middle" class="header-txt">⬅️ ENTRÉES (capteurs / signaux machine)</text>

  <!-- Digital inputs (optos) -->
  <g transform="translate(30,370)">
    <rect class="input" width="160" height="170" rx="6" />
    <text x="80" y="22" class="title" text-anchor="middle">4× Entrées isolées</text>
    <text x="80" y="38" class="small" text-anchor="middle">5-24V DC (PC817 optos)</text>
    <text x="80" y="55" class="small" text-anchor="middle">→ GPIO 32, 33, 25, 26</text>

    <!-- 4 borniers -->
    <rect class="block" x="15" y="65" width="30" height="20" />
    <rect class="block" x="15" y="90" width="30" height="20" />
    <rect class="block" x="15" y="115" width="30" height="20" />
    <rect class="block" x="15" y="140" width="30" height="20" />
    <text x="30" y="80" class="pin" text-anchor="middle">IN1</text>
    <text x="30" y="105" class="pin" text-anchor="middle">IN2</text>
    <text x="30" y="130" class="pin" text-anchor="middle">IN3</text>
    <text x="30" y="155" class="pin" text-anchor="middle">IN4</text>

    <!-- Optos -->
    <rect class="block" x="60" y="65" width="80" height="95" />
    <text x="100" y="85" class="small" text-anchor="middle">U4-U7</text>
    <text x="100" y="100" class="small" text-anchor="middle">PC817 ×4</text>
    <text x="100" y="115" class="small" text-anchor="middle">Isolation</text>
    <text x="100" y="130" class="small" text-anchor="middle">3kV galv.</text>
    <text x="100" y="148" class="pin" text-anchor="middle">→ GPIOs</text>
  </g>

  <!-- Pulse counter -->
  <g transform="translate(200,370)">
    <rect class="input" width="160" height="80" rx="6" />
    <text x="80" y="22" class="title" text-anchor="middle">Compteur impulsions</text>
    <text x="80" y="38" class="small" text-anchor="middle">jusqu'à 10 kHz</text>
    <text x="80" y="55" class="small" text-anchor="middle">→ GPIO 34 (PCNT HW)</text>
    <rect class="block" x="15" y="60" width="30" height="15" />
    <text x="30" y="71" class="pin" text-anchor="middle">PUL</text>
    <text x="100" y="71" class="small" text-anchor="middle">Schmitt trigger 74HC14</text>
  </g>

  <!-- Analog 0-10V / 4-20mA -->
  <g transform="translate(200,460)">
    <rect class="input" width="160" height="80" rx="6" />
    <text x="80" y="22" class="title" text-anchor="middle">Analogiques</text>
    <text x="80" y="38" class="small" text-anchor="middle">2× 0-10V + 2× 4-20mA</text>
    <text x="80" y="55" class="small" text-anchor="middle">→ GPIO 35, 36, 39 + MCP3008</text>
    <rect class="block" x="15" y="60" width="30" height="15" />
    <text x="30" y="71" class="pin" text-anchor="middle">A1..A4</text>
  </g>

  <!-- OneWire (DS18B20) -->
  <g transform="translate(370,370)">
    <rect class="input" width="150" height="80" rx="6" />
    <text x="75" y="22" class="title" text-anchor="middle">OneWire ×2</text>
    <text x="75" y="38" class="small" text-anchor="middle">DS18B20 / DHT22</text>
    <text x="75" y="55" class="small" text-anchor="middle">→ GPIO 15, 14 (4.7kΩ pull-up)</text>
    <rect class="block" x="15" y="60" width="50" height="15" />
    <text x="40" y="71" class="pin" text-anchor="middle">T1 T2</text>
  </g>

  <!-- I2C -->
  <g transform="translate(370,460)">
    <rect class="input" width="150" height="80" rx="6" />
    <text x="75" y="22" class="title" text-anchor="middle">I²C (Grove)</text>
    <text x="75" y="38" class="small" text-anchor="middle">SCL/SDA + 3.3V/GND</text>
    <text x="75" y="55" class="small" text-anchor="middle">Accéléro, OLED, BME280…</text>
    <rect class="block" x="15" y="60" width="50" height="15" />
    <text x="40" y="71" class="pin" text-anchor="middle">Grove</text>
  </g>

  <!-- ===================== OUTPUTS BLOCK ===================== -->
  <rect class="header-bar" x="880" y="340" width="490" height="22" rx="3" />
  <text x="1125" y="356" text-anchor="middle" class="header-txt">➡️ SORTIES (commandes vers machine)</text>

  <!-- Relais -->
  <g transform="translate(880,370)">
    <rect class="output" width="200" height="170" rx="6" />
    <text x="100" y="22" class="title" text-anchor="middle">2× Relais 10A 250V</text>
    <text x="100" y="38" class="small" text-anchor="middle">SRD-05VDC-SL-C</text>
    <text x="100" y="55" class="small" text-anchor="middle">+ Varistance + flyback</text>
    <text x="100" y="72" class="small" text-anchor="middle">→ GPIO 13, 12</text>

    <rect class="block" x="20" y="85" width="75" height="70" />
    <text x="57" y="105" class="small" text-anchor="middle">Relais K1</text>
    <text x="57" y="120" class="pin" text-anchor="middle">NO/NC/COM</text>
    <text x="57" y="138" class="small" text-anchor="middle">Q1 BC547</text>

    <rect class="block" x="105" y="85" width="75" height="70" />
    <text x="142" y="105" class="small" text-anchor="middle">Relais K2</text>
    <text x="142" y="120" class="pin" text-anchor="middle">NO/NC/COM</text>
    <text x="142" y="138" class="small" text-anchor="middle">Q2 BC547</text>
  </g>

  <!-- Open collector -->
  <g transform="translate(1090,370)">
    <rect class="output" width="140" height="80" rx="6" />
    <text x="70" y="22" class="title" text-anchor="middle">2× Open-collector</text>
    <text x="70" y="38" class="small" text-anchor="middle">100mA / 40V</text>
    <text x="70" y="55" class="small" text-anchor="middle">→ GPIO 4, 2</text>
    <rect class="block" x="15" y="60" width="50" height="15" />
    <text x="40" y="71" class="pin" text-anchor="middle">OC1 OC2</text>
  </g>

  <!-- Buzzer + RGB -->
  <g transform="translate(1090,460)">
    <rect class="output" width="140" height="80" rx="6" />
    <text x="70" y="22" class="title" text-anchor="middle">Buzzer + LED</text>
    <text x="70" y="38" class="small" text-anchor="middle">Piezo + WS2812 RGB</text>
    <text x="70" y="55" class="small" text-anchor="middle">→ GPIO 17, 16</text>
    <rect class="block" x="15" y="60" width="50" height="15" />
    <text x="40" y="71" class="pin" text-anchor="middle">BZ + LED</text>
  </g>

  <!-- RS485 -->
  <g transform="translate(880,560)">
    <rect class="comms" width="200" height="80" rx="6" />
    <text x="100" y="22" class="title" text-anchor="middle">RS485</text>
    <text x="100" y="38" class="small" text-anchor="middle">MAX485 transceiver</text>
    <text x="100" y="55" class="small" text-anchor="middle">Machines pro (TX/RX/RE/DE)</text>
    <rect class="block" x="15" y="60" width="50" height="15" />
    <text x="40" y="71" class="pin" text-anchor="middle">A B GND</text>
  </g>

  <!-- ===================== CONNECTIONS / WIRES ===================== -->
  <!-- Power → ESP32 -->
  <line x1="310" y1="180" x2="540" y2="200" class="wire-power" />
  <text x="425" y="175" class="small" text-anchor="middle" fill="#b91c1c">5V DC</text>

  <!-- Inputs → ESP32 (gauche) -->
  <line x1="520" y1="425" x2="555" y2="425" class="wire" />
  <text x="535" y="418" class="small" text-anchor="middle">I/O</text>

  <!-- ESP32 → Outputs (droite) -->
  <line x1="860" y1="425" x2="880" y2="425" class="wire" />

  <!-- ===================== LÉGENDE ===================== -->
  <g transform="translate(30,680)">
    <rect class="block" width="1340" height="180" rx="6" />
    <text x="20" y="30" class="title">📐 Caractéristiques techniques</text>

    <text x="20" y="60" class="label" font-weight="bold">Format :</text>
    <text x="100" y="60" class="label">100 × 80 mm, 2 couches FR-4 1.6mm, finition HASL ou ENIG</text>

    <text x="20" y="82" class="label" font-weight="bold">Alimentation :</text>
    <text x="120" y="82" class="label">9-30V DC large plage, protection polyfuse 1A + TVS 24V + varistance 30V</text>

    <text x="20" y="104" class="label" font-weight="bold">Isolation :</text>
    <text x="100" y="104" class="label">4 entrées numériques optoisolées 3kV (PC817), idéal pour signaux industriels</text>

    <text x="20" y="126" class="label" font-weight="bold">Entrées :</text>
    <text x="100" y="126" class="label">4 numériques 5-24V · 1 pulse 10kHz · 2 analogiques 0-10V · 2 boucles 4-20mA · 2 OneWire · I²C · RS485</text>

    <text x="20" y="148" class="label" font-weight="bold">Sorties :</text>
    <text x="100" y="148" class="label">2 relais 10A 250V (NO/NC/COM) · 2 open-collector 100mA · buzzer piezo · LED RGB WS2812</text>

    <text x="20" y="170" class="label" font-weight="bold">Connectique :</text>
    <text x="120" y="170" class="label">14 borniers à vis 3.5mm Phoenix Contact démontables · 1 connecteur Grove I²C · 1 barrel jack</text>

    <text x="780" y="60" class="label" font-weight="bold">Coût composants :</text>
    <text x="900" y="60" class="label">~13€/u en série de 100 (hors LilyGO)</text>

    <text x="780" y="82" class="label" font-weight="bold">PCB JLCPCB :</text>
    <text x="900" y="82" class="label">~5€/u en série (25€ pour 5 pièces de proto)</text>

    <text x="780" y="104" class="label" font-weight="bold">Temps montage :</text>
    <text x="900" y="104" class="label">5 min/carte si SMT assembly chez JLCPCB</text>

    <text x="780" y="126" class="label" font-weight="bold">Boîtier :</text>
    <text x="900" y="126" class="label">IP65 115×90×55mm (Hammond 1554 ou équivalent) ~10€</text>

    <text x="780" y="148" class="label" font-weight="bold">Total/machine :</text>
    <text x="900" y="148" class="label" font-weight="bold">~123€ TTC tout compris en grande série</text>

    <text x="780" y="170" class="label" font-weight="bold">Marge à 9€/mois :</text>
    <text x="940" y="170" class="label" font-weight="bold" fill="#047857">remboursé en 14 mois, puis marge nette</text>
  </g>
</svg>
